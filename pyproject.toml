[project]
name = "llm-openrouter-decisions"
version = "0.1a1"
description = "LLM plugin for the decision models of the OpenRouter Decisions API"
readme = "README.md"
authors = [{name = "Andrea Borruso"}]
license = "Apache-2.0"
classifiers = []
requires-python = ">=3.10"
dependencies = [
    "llm>=0.36",
    "httpx2>=2.13.0",
    "pydantic>=2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.sdist]
include = [
    "/llm_openrouter_decisions.py",
    "/tests/**/*.py",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
only-include = ["llm_openrouter_decisions.py"]

[project.urls]
Homepage = "https://github.com/aborruso/llm-openrouter-decisions"
Changelog = "https://github.com/aborruso/llm-openrouter-decisions/releases"
Issues = "https://github.com/aborruso/llm-openrouter-decisions/issues"
CI = "https://github.com/aborruso/llm-openrouter-decisions/actions"

[project.entry-points.llm]
openrouter_decisions = "llm_openrouter_decisions"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx2-pytest>=2"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# Example scripts mirror the README code, written compact on purpose
extend-exclude = ["examples"]
